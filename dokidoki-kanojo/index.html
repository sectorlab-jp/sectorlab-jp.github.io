<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#191723">
<meta name="description" content="ドキドキ彼女！ 大好きな彼女とのLINE。返信、まちがえないでね？">
<title>ドキドキ彼女！</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18121f}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:2px solid #ffa7d6;outline-offset:2px}
#app{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:#1c182b;color:#fff}
@media(min-width:620px){#app{max-width:480px;box-shadow:0 0 100px #0008}}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
.poster{position:absolute;inset:0;pointer-events:none;background:#402b3d;overflow:hidden}
.poster img{position:absolute;top:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-25%);pointer-events:none}
#scare .poster img{transform:translateX(-75%)}#start{position:absolute;z-index:4;inset:0;display:block;width:100%;height:100%;border:0;background:transparent}
#start .fallback-title{display:none}#title.noart .fallback-title{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;height:100%;font-size:27px;text-shadow:0 2px 14px #5d1a42;background:radial-gradient(ellipse at center,#f3a3bb,#472b48)}#title.noart .fallback-title b{font-size:20px}#scare.noart .poster:after{content:'🔪';font-size:160px;display:grid;place-items:center;height:100%;background:#311721}
#white,#black{position:absolute;inset:0;z-index:50;opacity:0;pointer-events:none}#white{background:#fff}#black{background:#04030a;z-index:49}
#chat{color:#fff;background:#282434;--mood-tint:#b894bb}
#chat .mist{position:absolute;inset:0;overflow:hidden;pointer-events:none;isolation:isolate;background:radial-gradient(ellipse at 75% 34%,#584458 0%,transparent 60%),linear-gradient(135deg,#29293e,#302a3d 50%,#1f1d2d)}
#chat .mist::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 90% 30%,rgba(234,152,186,.10),transparent 57%),linear-gradient(180deg,#29243580,#1a1b30b8)}
#portrait{position:absolute;z-index:1;top:6.5%;right:-22%;width:min(78vw,342px);height:auto;max-height:79%;object-fit:contain;object-position:top right;opacity:.91;filter:saturate(.91) brightness(.93);-webkit-mask-image:radial-gradient(ellipse 82% 80% at 55% 43%,#000 0%,#000 48%,#000a 71%,transparent 97%);mask-image:radial-gradient(ellipse 82% 80% at 55% 43%,#000 0%,#000 48%,#000a 71%,transparent 97%);transition:opacity .22s ease,filter .22s ease;user-select:none}
#chat .mist::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(23,23,39,.55),rgba(23,23,39,.32) 41%,rgba(22,22,38,.03) 82%),linear-gradient(180deg,rgba(23,24,40,.16),transparent 39%,rgba(19,19,33,.42) 100%)}
#chat.danger .mist{background:radial-gradient(ellipse at 80% 35%,#65404d 0%,transparent 61%),linear-gradient(135deg,#231e31,#362a35)}
#chat.danger #portrait{opacity:.97;filter:saturate(.72) brightness(.87)}#chat.danger .mist::after{background:linear-gradient(90deg,#1d182da1,#221d3536 80%),linear-gradient(180deg,#241c3347,transparent 39%,#3f1a2d77 100%)}
#chat #header{position:absolute;z-index:6;left:0;right:0;top:0;min-height:70px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px;background:rgba(27,28,42,.97);border-bottom:1px solid #ffffff0e}
#back{background:none;border:0;color:#fff;width:28px;height:40px;display:grid;place-items:center;padding:0}
#back svg{width:26px;height:27px}#who{min-width:0}#who strong{display:block;font-size:20px;line-height:1.2;font-weight:730}#who small{display:block;color:#c0c0d0;font-size:12px;margin-top:3px}
#header .tools{display:flex;align-items:center;gap:17px;margin-left:auto;flex-shrink:0;color:#f4f2f6}#header svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tools svg{width:20px;height:20px}
#timeline{position:absolute;z-index:5;top:calc(75px + env(safe-area-inset-top));bottom:calc(242px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:18px 11px 24px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
#timeline::-webkit-scrollbar{display:none}
.msg{max-width:61%;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}.msg.me{align-self:flex-end;max-width:83%}
.face{width:35px;height:35px;min-width:35px;border:1px solid #b9afbe;border-radius:50%;overflow:hidden;background:#655165;box-shadow:0 0 2px #eee8;flex-shrink:0}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.bubble{min-width:0;max-width:100%;border-radius:16px 16px 16px 5px;padding:11px 13px;background:#faf9fd;color:#252330;font-size:clamp(14px,3.75vw,16px);font-weight:480;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 7px #0002}
.msg.me .bubble{background:#c5eeaf;color:#243021;border-radius:16px 16px 5px 16px}
#choices{position:absolute;z-index:6;left:0;right:0;bottom:calc(65px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;padding:8px 12px 12px;background:linear-gradient(180deg,transparent,#1e1b30a8 95%)}
.choice{display:flex;align-items:center;gap:12px;border:1.4px solid rgba(218,205,225,.77);background:rgba(36,34,52,.83);color:#fff;border-radius:15px;min-height:56px;width:100%;padding:9px 12px;text-align:left;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:inset 0 0 0 1px #ffffff0d;font-size:clamp(13px,3.7vw,15px)}.choice:active{background:#754c6b;transform:scale(.995)}
.choice .num{height:31px;width:31px;min-width:31px;display:grid;place-items:center;border-radius:50%;background:#d7b6c9;color:#3f3848;font-size:15px;font-weight:750}.choice .ctext{flex:1;line-height:1.35}
#compose{position:absolute;z-index:6;left:0;right:0;bottom:0;height:calc(65px + env(safe-area-inset-bottom));padding:9px 11px calc(9px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:11px;background:rgba(19,21,35,.94);border-top:1px solid #ffffff0d}
#compose svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#compose .round{border:1.6px solid #9b9bac;width:33px;height:33px;min-width:33px;border-radius:50%;display:grid;place-items:center}
#compose .fake{flex:1;min-width:0;display:flex;align-items:center;height:38px;padding:0 13px;background:#3e3d53;color:#b9b6c8;border-radius:24px;white-space:nowrap;overflow:hidden;font-size:13px}
#compose .icon{color:#dbd8e7}#compose .send{color:#e9a2c3}
#end{position:absolute;z-index:30;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:#0b060e;color:#fff;text-align:center}#end h2{font-size:clamp(39px,11vw,57px);margin:0;letter-spacing:.12em}#end p{margin:0;color:#f0c0d4;line-height:2}#end button{border:0;border-radius:50px;background:#eba0bb;color:#281925;padding:14px 36px;font-weight:750}
#red{position:absolute;inset:0;z-index:40;background:#b40025;opacity:0;pointer-events:none}
@media(max-height:715px){#timeline{bottom:calc(208px + env(safe-area-inset-bottom))}#choices{bottom:calc(57px + env(safe-area-inset-bottom));gap:6px;padding:6px 10px}#compose{height:calc(57px + env(safe-area-inset-bottom))} .choice{min-height:43px;padding:7px 10px}#portrait{top:5.5%;height:77%}}
@media(max-width:350px){.msg{max-width:66%}#header .tools{gap:11px}#timeline{padding-left:9px;padding-right:9px}.choice{min-height:48px}}

/* Optional browser guidance: same regular browser keeps locally stored memories more reliably. */
#memory-tip{position:absolute;z-index:7;left:50%;bottom:calc(11px + env(safe-area-inset-bottom));transform:translateX(-50%);border:1px solid #ffe3f3a9;background:#171223c9;color:#ffe8f5;border-radius:99px;padding:8px 13px;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.02em;box-shadow:0 3px 14px #130b249c;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#memory-tip:active{background:#483149e8}
#browser-guide{position:absolute;z-index:12;inset:0;display:none;align-items:flex-end;justify-content:center;padding:18px 14px calc(18px + env(safe-area-inset-bottom));background:#0b0718b8;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#browser-guide.open{display:flex}
#browser-guide-panel{width:100%;max-width:430px;background:#292037;border:1px solid #b18ca9;border-radius:22px;padding:21px 18px 17px;color:#ffedf6;box-shadow:0 14px 50px #0008;text-align:center}
#browser-guide-panel h2{font-size:20px;margin:2px 0 13px;color:#ffd4e9}
#browser-guide-panel p{font-size:14px;line-height:1.7;margin:0 0 12px}
#browser-guide-panel .guide-action{background:#3d304a;padding:12px;border-radius:12px;text-align:left;font-size:13px;line-height:1.65;margin:12px 0}
#browser-guide-panel .guide-note{color:#cdb9d0;font-size:11px;line-height:1.5;margin-bottom:12px}
#browser-guide-close{width:100%;border:0;border-radius:99px;background:#efabc9;color:#251826;font-weight:800;padding:13px;margin-top:3px}
@media(min-height:750px){#memory-tip{bottom:calc(16px + env(safe-area-inset-bottom))}}
</style></head>
<body>
<main id="app">
<section class="screen active" id="title"><div class="poster"><img class="art" src="./assets/sprite.webp" alt=""></div><button id="start" aria-label="はじめる"><span class="fallback-title">ドキドキ彼女！<br><b>大好きな彼女とのLINE</b><br>はじめる ♡</span></button><button type="button" id="memory-tip" aria-haspopup="dialog" aria-controls="browser-guide">♡ 美咲との思い出を残す？</button><div id="browser-guide" role="dialog" aria-modal="true" aria-labelledby="browser-guide-title"><div id="browser-guide-panel"><h2 id="browser-guide-title">思い出を残すには？ ♡</h2><p>いつも使うブラウザで遊んでね。<br>同じブラウザなら、美咲が前の記録を覚えていられるかも。</p><div id="browser-guide-how" class="guide-action"></div><p class="guide-note">※ X内のブラウザと外部ブラウザでは記録が共有されないことがあるよ。保存はブラウザの設定やデータ削除にも左右されるよ。現在は周回の記憶や名前を使うシークレット機能は制作中。</p><button type="button" id="browser-guide-close">わかった♡ ゲームへ戻る</button></div></div></section>
<section class="screen" id="scare"><div class="poster"><img class="art" src="./assets/sprite.webp" alt=""></div></section>
<section class="screen" id="chat"><div class="mist"><img id="portrait" src="./assets/misaki-normal.webp" alt="美咲の表情：通常"></div>
<header id="header"><button id="back" aria-label="タイトルに戻る"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button><div id="who"><strong>美咲 ♡</strong><small>オンライン</small></div><div class="tools" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15.3 15.3 5 5"/></svg><svg viewBox="0 0 24 24"><path d="M5 4.5c1-.7 2-.5 2.6.2l2.1 2.2c.6.7.6 1.6 0 2.3l-1.2 1.4c1.4 2.3 3.2 4.1 5.5 5.5l1.4-1.2c.7-.6 1.6-.6 2.3 0l2.2 2.1c.7.6.9 1.6.2 2.6l-1.5 1.6c-.8.8-1.8 1.2-3.1.8C10.7 21 3 13.3 2 8.1c-.3-1.2.1-2.3.8-3.1Z"/></svg><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div></header>
<div id="timeline" aria-live="polite"></div><div id="choices"></div>
<div id="compose" aria-hidden="true"><span class="round icon"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1"/><path d="m21 18-6-6-7 7"/></svg></span><span class="fake">メッセージを入力…</span><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c2 3 6 3 8 0M9 9h.01M15 9h.01"/></svg></span><span class="send"><svg viewBox="0 0 24 24"><path d="m3 4 18 8L3 20l3-8-3-8zM6 12h15"/></svg></span></div>
<div id="end"><h2>GAME OVER</h2><p>ねぇ、約束したよね？<br>ずっと一緒だって♡</p><button id="restart">もう一度</button></div><div id="red"></div></section>
<div id="black"></div><div id="white"></div>
</main>
<script>
'use strict';
const el=id=>document.getElementById(id);
const title=el('title'),scare=el('scare'),chat=el('chat'),white=el('white'),black=el('black'),red=el('red'),timeline=el('timeline'),choices=el('choices'),portrait=el('portrait');
const scenes=[title,scare,chat];
const faceImages={0:'normal',1:'plus1',2:'plus2',[-1]:'minus1',[-2]:'minus2'};
const moods={0:'通常',1:'＋1',2:'＋2',[-1]:'－1',[-2]:'－2'};
for(const name of Object.values(faceImages)){const img=new Image();img.src=`./assets/misaki-${name}.webp`}
let busy=false,epoch=0,miss=0,mood=0,step=0,dead=false;
const story=[
 {m:['ねぇ♡','今なにしてるの？','私のこと…\nちゃんと考えてる？♡','もしかして、\nほかの子といる…？','嘘でもいいから\n言ってほしいな…♡'],o:['家でゲームしてるよ！','美咲のこと考えてたよ♡','なんで？ 急にどうしたの？'],c:1,yes:'えへへ♡\nうれしい。',no:'……ゲームの方が\n大事なんだ？'},
 {m:['今日は誰といたの？'],o:['美咲が一番だよ','高校の友達とご飯！','秘密♡'],c:1,yes:'そっか♡\n楽しかった？',no:'……隠し事、\nしてる？'},
 {m:['今から会いに行ってもいい？'],o:['うん、来てほしい！','今日は疲れたからまたね','何時に来るの？'],c:0,yes:'やったぁ♡\nすぐ行くね。',no:'……私のこと、\n嫌いなの？'},
 {m:['私のこと、\nどれくらい好き？'],o:['世界で一番だよ','好きだよ','それ聞くの何回目？笑'],c:0,yes:'ふふっ。\n忘れないからね♡',no:'……ちゃんと\n答えて？'},
 {m:['最後にひとつだけ。','これからも、\nずっと一緒だよね？'],o:['もちろん！','できるだけね','重いって笑'],c:0,yes:'……うん。\n約束だよ♡',no:'……約束して\nくれないの？'}
];
function sleep(id,ms){return new Promise(resolve=>setTimeout(()=>resolve(id===epoch),ms))}
function show(screen){scenes.forEach(p=>p.classList.remove('active'));screen.classList.add('active')}
function faceFile(level=mood){return `./assets/misaki-${faceImages[level]}.webp`}
function setMood(){portrait.src=faceFile();portrait.alt='美咲の表情：'+moods[mood];chat.dataset.mood=String(mood);chat.classList.toggle('danger',mood<0);document.querySelectorAll('.face img').forEach(img=>{img.src=faceFile()})}
function reset(){epoch++;busy=false;miss=0;mood=0;step=0;dead=false;timeline.replaceChildren();choices.replaceChildren();white.style.opacity='0';black.style.opacity='0';red.style.opacity='0';el('end').style.display='none';setMood();show(title)}
function addMessage(value,mine=false){const row=document.createElement('div');row.className='msg'+(mine?' me':'');if(!mine){const frame=document.createElement('span');frame.className='face';const img=document.createElement('img');img.src=faceFile();img.alt='';frame.append(img);row.append(frame)}const b=document.createElement('div');b.className='bubble';b.textContent=value;row.append(b);timeline.append(row);timeline.scrollTop=timeline.scrollHeight}
async function intro(){if(busy)return;busy=true;const n=++epoch;white.style.opacity='1';if(!await sleep(n,85))return;show(scare);white.style.opacity='0';if(!await sleep(n,145))return;black.style.opacity='1';if(!await sleep(n,1050))return;show(chat);setMood();drawScene(n);if(!await sleep(n,130))return;black.style.opacity='0';busy=false}
async function drawScene(n){if(n!==epoch||dead)return;if(step>=story.length){choices.replaceChildren();addMessage('大好き。\nこれからも、ずっと。♡');return}const s=story[step];choices.replaceChildren();for(const m of s.m){if(!await sleep(n,370))return;addMessage(m)}if(n!==epoch||dead)return;s.o.forEach((txt,i)=>{const button=document.createElement('button');button.className='choice';const number=document.createElement('span');number.className='num';number.textContent=String(i+1);const caption=document.createElement('span');caption.className='ctext';caption.textContent=txt;button.append(number,caption);button.addEventListener('click',()=>answer(i));choices.append(button)})}
async function answer(i){if(busy||dead||step>=story.length)return;busy=true;const n=epoch,s=story[step];choices.replaceChildren();addMessage(s.o[i],true);if(i!==s.c){miss++;mood=miss>=2?-2:-1}else{mood=Math.min(2,mood+1)}setMood();if(!await sleep(n,450))return;if(miss>=2){await lose(n);return}addMessage(i===s.c?s.yes:s.no);step++;if(!await sleep(n,450))return;busy=false;drawScene(n)}
async function lose(n){dead=true;addMessage('……');if(!await sleep(n,630))return;for(let i=0;i<16;i++){addMessage('、');if(!await sleep(n,135))return}if(!await sleep(n,400))return;addMessage('さよなら。');if(!await sleep(n,790))return;white.style.opacity='1';show(scare);if(!await sleep(n,80))return;white.style.opacity='0';red.style.opacity='.65';if(!await sleep(n,155))return;red.style.opacity='0';black.style.opacity='1';if(!await sleep(n,1150))return;show(chat);el('end').style.display='flex';black.style.opacity='0'}
const browserGuide=el('browser-guide'),browserGuideTip=el('memory-tip'),browserGuideClose=el('browser-guide-close'),browserGuideHow=el('browser-guide-how');
(function setupBrowserGuide(){
 const agent=navigator.userAgent||'';
 const iphone=/iPhone|iPad|iPod/i.test(agent);
 const android=/Android/i.test(agent);
 const inX=/Twitter|TwitterAndroid|Twitter for/i.test(agent);
 browserGuideHow.textContent=iphone
   ?'Xアプリで開いた場合は、画面の「…」などのメニューから「ブラウザで開く」を選んで、Safariなど普段使うブラウザで遊んでね。'
   :android
   ?'Xアプリで開いた場合は、メニューから「ブラウザで開く」を選んで、Chromeなど普段使うブラウザで遊んでね。'
   :'PCなら今使っているブラウザでそのまま遊んでOK。別のブラウザや端末に変えると保存記録は共有されないよ。';
 const openGuide=()=>{browserGuide.classList.add('open');browserGuideClose.focus()};
 const closeGuide=()=>{browserGuide.classList.remove('open');browserGuideTip.focus()};
 browserGuideTip.addEventListener('click',openGuide);
 browserGuideClose.addEventListener('click',closeGuide);
 browserGuide.addEventListener('click',event=>{if(event.target===browserGuide)closeGuide()});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&browserGuide.classList.contains('open'))closeGuide()});
 if(inX)openGuide(); // Detection is best-effort; manual guidance stays visible on all devices.
})();
el('start').addEventListener('click',intro);el('back').addEventListener('click',reset);el('restart').addEventListener('click',reset);
document.querySelectorAll('.art').forEach(img=>{img.addEventListener('error',()=>img.closest('.screen').classList.add('noart'))});
setMood();
</script></body></html>
