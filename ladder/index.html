<style>
:root{color-scheme:dark;--bg:#091422;--ink:#f1f9ff;--muted:#a9bfd2;--aqua:#72f0db}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 22%,#225575 0%,transparent 43%),linear-gradient(#0c1a2b,#091422);display:grid;place-items:center;padding:24px}
main{width:min(100%,520px);text-align:center;background:#15253bbf;border:1px solid #38546c;border-radius:28px;padding:clamp(28px,7vw,58px) 24px;box-shadow:0 20px 70px #0005}
.illustration{font-size:clamp(78px,17vw,112px);line-height:1.5;filter:drop-shadow(0 10px 24px #0006)}
.eyebrow{display:inline-block;border:1px solid #69bdb8;color:var(--aqua);border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.16em;padding:9px 16px;margin:10px 0 20px}
h1{font-size:clamp(27px,6.5vw,38px);letter-spacing:-.045em;margin:0 0 14px}
p{font-size:15px;line-height:1.9;color:var(--muted);margin:0 auto 26px;max-width:380px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;background:#75eddf;color:#09232e;font-weight:900;text-decoration:none;border-radius:12px}
a:focus-visible{outline:3px solid white;outline-offset:3px}
.note{font-size:12px;opacity:.78;margin-top:22px}
</style>
</head>
<body>
<main>
<div class="illustration" aria-hidden="true">🪜</div>
<div class="eyebrow">COMING SOON</div>
<h1>のぼれ！無限ハシゴ</h1>
<p>長押しで踏ん張って、離して登る！<br>ただいま制作中。一般公開まで、もう少しお楽しみに。</p>
<a href="/">🎮 ゲームラボに戻る →</a>
<div class="note">公開まではゲームをプレイできません。</div>
