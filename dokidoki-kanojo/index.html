#title .title-bg::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#fff5f8 0%,#fff5f8 22%,#fff3f8e8 24%,#fff4f866 28%,transparent 32%,transparent 64%,#51334823 76%,#4620376b 92%,#301a2ccc 100%)}
#title .title-bg::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:none;border:0;box-shadow:inset 0 0 16px #fdbbd66b}
#title .title-scene{position:absolute;inset:0 auto auto 50%;height:100%;width:auto;max-width:none;transform:translateX(-25%);object-fit:contain;opacity:1;filter:none;-webkit-mask-image:none;mask-image:none}
#title .title-brand{top:calc(2.5% + env(safe-area-inset-top));left:3%;right:3%;z-index:5}
#title .title-kicker{font-size:10px;letter-spacing:.22em;color:#ad6680;font-weight:750}
#title h1{margin:5px 0 4px;color:#a53c66;font-size:clamp(31px,8.7vw,47px);line-height:1.09;letter-spacing:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;text-shadow:0 2px 0 #fff9,0 3px 12px #a45d7a77;font-weight:900}
#title h1 em{color:#ba3a70;letter-spacing:-.055em}
#title .title-brand p{margin:7px auto 0;background:#fff9fceb;border:1px solid #e1acbe;color:#743650;line-height:1.42;padding:7px 15px;font-size:clamp(12px,3.3vw,14px);border-radius:99px;box-shadow:0 3px 13px #a65c7460;font-weight:750}
#title #start{left:9%;right:9%;width:82%;bottom:calc(14% + env(safe-area-inset-bottom));height:65px;z-index:6;background:linear-gradient(180deg,#ffbad8,#df6a9d 47%,#bc4478 100%);border:2px solid #fff3fa;outline:1px solid #fae4ef;box-shadow:0 4px 0 #92435e,0 11px 24px #3f13268a,inset 0 3px 6px #fff9}
#title #start .start-label{font-size:clamp(23px,6.5vw,28px);letter-spacing:.14em}
#title #memory-tip{position:absolute;z-index:6;left:7%;right:7%;width:86%;transform:none;bottom:calc(23% + env(safe-area-inset-bottom));min-height:53px;white-space:normal;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 13px;font-size:clamp(16px,4.4vw,19px);letter-spacing:.015em;color:#923b62;border:2px solid #fff9fd;border-radius:99px;background:#fff4f9f6;box-shadow:0 5px 0 #a66f8aa8,0 7px 18px #51233f9e;font-weight:800;text-shadow:none}
@media(max-height:690px){#title .title-brand{top:calc(1.6% + env(safe-area-inset-top))}#title h1{font-size:clamp(29px,8vw,40px)}#title .title-brand p{margin-top:4px;padding:5px 11px}#title #start{bottom:calc(13% + env(safe-area-inset-bottom));height:55px}#title #memory-tip{bottom:calc(24% + env(safe-area-inset-bottom));min-height:45px}}


/* v10 illustrated interactive screens. Exact rendered artwork replaces styled text/card UI. */
.image-screen{position:absolute;inset:0;isolation:isolate;overflow:hidden}
#title.image-screen,#warning.image-screen{background:#251621}
#warning.image-screen.active,#title.image-screen.active{display:block;padding:0;overflow:hidden}
.image-screen .full-screen-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
#title #start,#title #memory-tip,#warning #warning-accept,#warning #warning-back{position:absolute;z-index:5;display:block;margin:0;padding:0;min-height:0;max-height:none;transform:none;outline:none;border:0;border-radius:24px;background:transparent;box-shadow:none;text-shadow:none;color:transparent;font-size:0;line-height:1;white-space:normal;cursor:pointer;touch-action:manipulation;appearance:none;-webkit-appearance:none}
#title #memory-tip{left:17%;right:17%;width:66%;top:76.8%;bottom:auto;height:7.4%;z-index:7}
#title #start{left:13%;right:13%;width:74%;top:85.1%;bottom:auto;height:8.7%;z-index:6}
#warning #warning-accept{left:11%;right:11%;width:78%;top:77.1%;bottom:auto;height:9.2%;z-index:6}
#warning #warning-back{left:28%;right:28%;width:44%;top:89.3%;bottom:auto;height:5.1%;z-index:6}
#title #memory-tip:active,#title #start:active,#warning #warning-accept:active,#warning #warning-back:active{background:#ffffff29;box-shadow:0 0 13px #ffe5f2a6}
#title #memory-tip:focus-visible,#title #start:focus-visible,#warning #warning-accept:focus-visible,#warning #warning-back:focus-visible{outline:3px solid #ffffff;outline-offset:1px}
#title #browser-guide{z-index:14}
@media(max-height:690px){#title #start{top:85.1%;height:8.7%;bottom:auto}#title #memory-tip{top:76.8%;height:7.4%;bottom:auto}#warning #warning-accept{top:77.1%;height:9.2%}#warning #warning-back{top:89.3%;height:5.1%}}


/* v11 fix: show a real, legible memory button over the artwork's empty text plate. */
#title.image-screen #memory-tip.memory-visible{
  position:absolute;z-index:9;left:12%;right:12%;width:76%;
  top:76.65%;bottom:auto;height:7.8%;min-height:47px;max-height:77px;
  display:flex;justify-content:center;align-items:center;gap:8px;
  margin:0;padding:0 12px;overflow:hidden;
  background:linear-gradient(180deg,#fffdfa 0%,#fff0f7 76%,#f9dbe8 100%);
  border:2px solid #fffdfc;border-radius:999px;
  outline:1px solid #bf7196;outline-offset:0;
  color:#823c5d;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:clamp(16px,4.6vw,21px);line-height:1.15;
  font-weight:800;letter-spacing:-.04em;white-space:nowrap;
  text-shadow:0 1px 0 #fff;opacity:1;
  box-shadow:0 3px 0 #a45d7d,0 7px 16px #3721306b,inset 0 2px 5px #fff;
  appearance:none;-webkit-appearance:none;transform:none;
  -webkit-backdrop-filter:none;backdrop-filter:none
}
#title #memory-tip.memory-visible .memory-icon{font-family:serif;font-size:1.18em;color:#b24977;line-height:1;flex-shrink:0}
#title #memory-tip.memory-visible .memory-label{display:inline;overflow:visible;white-space:nowrap;flex-shrink:0}
#title #memory-tip.memory-visible .memory-arrow{font-family:sans-serif;font-size:1.3em;color:#ac577b;line-height:1;flex-shrink:0}
#title #memory-tip.memory-visible:active{background:#ffe1ed;transform:translateY(2px);box-shadow:0 1px 0 #a45d7d,0 3px 9px #3721306b}
#title #memory-tip.memory-visible:focus-visible{outline:3px solid #803854;outline-offset:3px}
@media(max-width:360px){#title.image-screen #memory-tip.memory-visible{font-size:clamp(15px,4.5vw,18px);gap:5px;padding:0 9px}}
@media(max-height:690px){#title.image-screen #memory-tip.memory-visible{top:76.65%;bottom:auto;height:7.8%;min-height:39px}}
</style></head>
<body>
<main id="app">
<section class="screen active image-screen" id="title">
 <img class="full-screen-art" src="./assets/himitsu-title.webp" alt="彼女とひみつの時間♡ 大好きな彼女と、ふたりだけのおしゃべり。美咲のいる部屋のタイトル画面" draggable="false" fetchpriority="high">
 <button type="button" class="art-hit memory-visible" id="memory-tip" aria-haspopup="dialog" aria-controls="browser-guide" aria-label="美咲との思い出を残す？"><span class="memory-icon" aria-hidden="true">♡</span><span class="memory-label">美咲との思い出を残す？</span><span class="memory-arrow" aria-hidden="true">›</span></button>
 <button type="button" class="art-hit" id="start" aria-label="はじめる"><span class="visually-hidden">はじめる</span></button>
 <div id="browser-guide" role="dialog" aria-modal="true" aria-labelledby="browser-guide-title"><div id="browser-guide-panel"><h2 id="browser-guide-title">思い出を残すには？ ♡</h2><p>いつも使うブラウザで遊んでね。<br>同じブラウザなら、美咲が前の記録を覚えていられるかも。</p><div id="browser-guide-how" class="guide-action"></div><p class="guide-note">※ X内のブラウザと外部ブラウザでは記録が共有されないことがあるよ。保存はブラウザの設定やデータ削除にも左右されるよ。現在は周回の記憶や名前を使うシークレット機能は制作中。</p><button type="button" id="browser-guide-close">わかった♡ ゲームへ戻る</button></div></div>
</section>
<section class="screen image-screen" id="warning">
 <img class="full-screen-art" src="./assets/himitsu-warning.webp" alt="プレイ前のご案内。ホラー・心理的恐怖、流血・刃物・暴力表現、監禁・拷問を示唆する表現、突然驚かせる演出、画面の点滅・フラッシュが含まれる。推奨年齢15歳以上（制作者による自主設定）。気分が悪くなったらプレイをやめてね。泣きそうなミニ美咲。" draggable="false">
 <button type="button" class="art-hit" id="warning-accept" aria-label="内容を理解してプレイする"><span class="visually-hidden">内容を理解してプレイする</span></button>
 <button type="button" class="art-hit" id="warning-back" aria-label="タイトルに戻る"><span class="visually-hidden">タイトルに戻る</span></button>
</section>
<section class="screen" id="scare"><div class="poster"><img class="art" src="./assets/sprite.webp" alt=""></div></section>
<section class="screen" id="chat"><div class="mist"><img id="portrait" src="./assets/misaki-normal.webp" alt="美咲の表情：通常"></div>
<header id="header"><button id="back" aria-label="タイトルに戻る"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button><div id="who"><strong>美咲 ♡</strong><small>オンライン</small></div><div class="tools" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15.3 15.3 5 5"/></svg><svg viewBox="0 0 24 24"><path d="M5 4.5c1-.7 2-.5 2.6.2l2.1 2.2c.6.7.6 1.6 0 2.3l-1.2 1.4c1.4 2.3 3.2 4.1 5.5 5.5l1.4-1.2c.7-.6 1.6-.6 2.3 0l2.2 2.1c.7.6.9 1.6.2 2.6l-1.5 1.6c-.8.8-1.8 1.2-3.1.8C10.7 21 3 13.3 2 8.1c-.3-1.2.1-2.3.8-3.1Z"/></svg><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div></header>
<div id="timeline" aria-live="polite"></div><div id="choices"></div>
<div id="compose" aria-hidden="true"><span class="round icon"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1"/><path d="m21 18-6-6-7 7"/></svg></span><span class="fake">メッセージを入力…</span><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c2 3 6 3 8 0M9 9h.01M15 9h.01"/></svg></span><span class="send"><svg viewBox="0 0 24 24"><path d="m3 4 18 8L3 20l3-8-3-8zM6 12h15"/></svg></span></div>
<div id="end"><h2>GAME OVER</h2><p>ねぇ、約束したよね？<br>ずっと一緒だって♡</p><button id="restart">もう一度</button></div><div id="red"></div></section>
<div id="black"></div><div id="white"></div>
</main>
<script>
'use strict';
const el=id=>document.getElementById(id);
const title=el('title'),scare=el('scare'),chat=el('chat'),white=el('white'),black=el('black'),red=el('red'),timeline=el('timeline'),choices=el('choices'),portrait=el('portrait');
const warning=el('warning');
const scenes=[title,warning,scare,chat];
const faceImages={0:'normal',1:'plus1',2:'plus2',[-1]:'minus1',[-2]:'minus2'};
const moods={0:'通常',1:'＋1',2:'＋2',[-1]:'－1',[-2]:'－2'};
for(const name of Object.values(faceImages)){const img=new Image();img.src=`./assets/misaki-${name}.webp`}
let busy=false,epoch=0,miss=0,mood=0,step=0,dead=false;
const story=[
 {m:['ねぇ♡','今なにしてるの？','私のこと…\nちゃんと考えてる？♡','もしかして、\nほかの子といる…？','嘘でもいいから\n言ってほしいな…♡'],o:['家でゲームしてるよ！','美咲のこと考えてたよ♡','なんで？ 急にどうしたの？'],c:1,yes:'えへへ♡\nうれしい。',no:'……ゲームの方が\n大事なんだ？'},
 {m:['今日は誰といたの？'],o:['美咲が一番だよ','高校の友達とご飯！','秘密♡'],c:1,yes:'そっか♡\n楽しかった？',no:'……隠し事、\nしてる？'},
 {m:['今から会いに行ってもいい？'],o:['うん、来てほしい！','今日は疲れたからまたね','何時に来るの？'],c:0,yes:'やったぁ♡\nすぐ行くね。',no:'……私のこと、\n嫌いなの？'},
 {m:['私のこと、\nどれくらい好き？'],o:['世界で一番だよ','好きだよ','それ聞くの何回目？笑'],c:0,yes:'ふふっ。\n忘れないからね♡',no:'……ちゃんと\n答えて？'},
 {m:['最後にひとつだけ。','これからも、\nずっと一緒だよね？'],o:['もちろん！','できるだけね','重いって笑'],c:0,yes:'……うん。\n約束だよ♡',no:'……約束して\nくれないの？'}
];
function sleep(id,ms){return new Promise(resolve=>setTimeout(()=>resolve(id===epoch),ms))}
function show(screen){scenes.forEach(p=>p.classList.remove('active'));screen.classList.add('active')}
function faceFile(level=mood){return `./assets/misaki-${faceImages[level]}.webp`}
function setMood(){portrait.src=faceFile();portrait.alt='美咲の表情：'+moods[mood];chat.dataset.mood=String(mood);chat.classList.toggle('danger',mood<0);document.querySelectorAll('.face img').forEach(img=>{img.src=faceFile()})}
function reset(){epoch++;busy=false;miss=0;mood=0;step=0;dead=false;timeline.replaceChildren();choices.replaceChildren();white.style.opacity='0';black.style.opacity='0';red.style.opacity='0';el('end').style.display='none';setMood();show(title)}
function addMessage(value,mine=false){const row=document.createElement('div');row.className='msg'+(mine?' me':'');if(!mine){const frame=document.createElement('span');frame.className='face';const img=document.createElement('img');img.src=faceFile();img.alt='';frame.append(img);row.append(frame)}const b=document.createElement('div');b.className='bubble';b.textContent=value;row.append(b);timeline.append(row);timeline.scrollTop=timeline.scrollHeight}
async function intro(){if(busy)return;busy=true;const n=++epoch;white.style.opacity='1';if(!await sleep(n,85))return;show(scare);white.style.opacity='0';if(!await sleep(n,145))return;black.style.opacity='1';if(!await sleep(n,1050))return;show(chat);setMood();drawScene(n);if(!await sleep(n,130))return;black.style.opacity='0';busy=false}
async function drawScene(n){if(n!==epoch||dead)return;if(step>=story.length){choices.replaceChildren();addMessage('大好き。\nこれからも、ずっと。♡');return}const s=story[step];choices.replaceChildren();for(const m of s.m){if(!await sleep(n,370))return;addMessage(m)}if(n!==epoch||dead)return;s.o.forEach((txt,i)=>{const button=document.createElement('button');button.className='choice';const number=document.createElement('span');number.className='num';number.textContent=String(i+1);const caption=document.createElement('span');caption.className='ctext';caption.textContent=txt;button.append(number,caption);button.addEventListener('click',()=>answer(i));choices.append(button)})}
async function answer(i){if(busy||dead||step>=story.length)return;busy=true;const n=epoch,s=story[step];choices.replaceChildren();addMessage(s.o[i],true);if(i!==s.c){miss++;mood=miss>=2?-2:-1}else{mood=Math.min(2,mood+1)}setMood();if(!await sleep(n,450))return;if(miss>=2){await lose(n);return}addMessage(i===s.c?s.yes:s.no);step++;if(!await sleep(n,450))return;busy=false;drawScene(n)}
async function lose(n){dead=true;addMessage('……');if(!await sleep(n,630))return;for(let i=0;i<16;i++){addMessage('、');if(!await sleep(n,135))return}if(!await sleep(n,400))return;addMessage('さよなら。');if(!await sleep(n,790))return;white.style.opacity='1';show(scare);if(!await sleep(n,80))return;white.style.opacity='0';red.style.opacity='.65';if(!await sleep(n,155))return;red.style.opacity='0';black.style.opacity='1';if(!await sleep(n,1150))return;show(chat);el('end').style.display='flex';black.style.opacity='0'}
const browserGuide=el('browser-guide'),browserGuideTip=el('memory-tip'),browserGuideClose=el('browser-guide-close'),browserGuideHow=el('browser-guide-how');
(function setupBrowserGuide(){
 const agent=navigator.userAgent||'';
 const iphone=/iPhone|iPad|iPod/i.test(agent);
 const android=/Android/i.test(agent);
 const inX=/Twitter|TwitterAndroid|Twitter for/i.test(agent);
 browserGuideHow.textContent=iphone
   ?'Xアプリで開いた場合は、画面の「…」などのメニューから「ブラウザで開く」を選んで、Safariなど普段使うブラウザで遊んでね。'
   :android
   ?'Xアプリで開いた場合は、メニューから「ブラウザで開く」を選んで、Chromeなど普段使うブラウザで遊んでね。'
   :'PCなら今使っているブラウザでそのまま遊んでOK。別のブラウザや端末に変えると保存記録は共有されないよ。';
 const openGuide=()=>{browserGuide.classList.add('open');browserGuideClose.focus()};
 const closeGuide=()=>{browserGuide.classList.remove('open');browserGuideTip.focus()};
 browserGuideTip.addEventListener('click',openGuide);
 browserGuideClose.addEventListener('click',closeGuide);
 browserGuide.addEventListener('click',event=>{if(event.target===browserGuide)closeGuide()});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&browserGuide.classList.contains('open'))closeGuide()});
 if(inX)openGuide(); // Detection is best-effort; manual guidance stays visible on all devices.
})();
el('start').addEventListener('click',()=>{if(!busy)show(warning)});
el('warning-accept').addEventListener('click',intro);
el('warning-back').addEventListener('click',()=>show(title));el('back').addEventListener('click',reset);el('restart').addEventListener('click',reset);
document.querySelectorAll('.art').forEach(img=>{img.addEventListener('error',()=>img.closest('.screen').classList.add('noart'))});
setMood();
</script></body></html>
