<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d1320">
<title>ドキドキ彼女！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#170e19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
button{font:inherit;touch-action:manipulation;cursor:pointer}
#app{position:relative;margin:auto;width:100%;max-width:calc(100dvh * 941/1672);height:100dvh;overflow:hidden;isolation:isolate;background:#261522;color:#fff}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
.poster{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#ffcce5,#614256)}
.poster img{position:absolute;top:0;height:100%;width:auto;max-width:none;left:50%;transform:translateX(-25%);pointer-events:none}
#scare .poster img{transform:translateX(-75%)}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:radial-gradient(ellipse at top,#ffb8d3,#44283e 65%,#1c1524);pointer-events:none}
.fallback b{font-size:clamp(26px,7.5vw,42px);text-shadow:0 4px 14px #812650}.fallback p{letter-spacing:.08em}.fallback .icon{font-size:90px}
#start{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;z-index:5;display:block}
#start:focus-visible{outline:4px solid #fff;outline-offset:-8px}
#start .vis-label{position:absolute;bottom:13%;left:15%;right:15%;height:8%;display:none;place-items:center;background:#ef80ae;border:2px solid #ffd5e7;border-radius:100px;font-size:24px;font-weight:800;box-shadow:0 0 32px #ffd1e9}
#title.noart .fallback,#title.noart .vis-label{display:grid}
#scare.noart .fallback{display:flex;background:radial-gradient(ellipse at center,#65151c,#130a11 76%)}
#flash{position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
#dark{position:absolute;inset:0;z-index:29;background:#000;opacity:0;pointer-events:none}
#chat{background:#312c38;color:#222;--pose:0%;}
#chat .mist{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:#38303e}
#chat .portrait{position:absolute;inset:-2% -10% -1% -5%;background-image:url("./assets/emotions.webp");background-size:500% 100%;background-position:var(--pose) center;background-repeat:no-repeat;opacity:.91;transform:translateX(8%) scale(1.035);filter:brightness(.88) saturate(.78);transition:filter .24s,opacity .24s}
#chat .mist:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,26,39,.48),rgba(27,24,36,.27) 47%,rgba(27,23,39,.52))}
#chat.danger .portrait{filter:brightness(.74) saturate(.65)}
#chat.danger .mist:after{background:linear-gradient(180deg,#241b32a6,#34263849 45%,#251622a6)}
#chat.danger{background:#b6b5b7}
#chat.danger::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px #60091d55;pointer-events:none;z-index:3}
.hdr{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:13px;background:#f5f5f3ed;padding:calc(env(safe-area-inset-top) + 10px) 15px 12px;box-shadow:0 2px 8px #0002}
.avatar{border:2px solid #fff;background-color:#c9a2b7;background-image:url("./assets/emotions.webp");background-size:500% 245%;background-position:var(--pose) 20%;background-repeat:no-repeat;width:40px;height:40px;border-radius:50%;flex-shrink:0}
.nm{font-weight:800;font-size:18px}.online{font-size:11px;color:#92999c;margin-top:2px}
.back{margin-left:auto;border:0;border-radius:9px;padding:8px 10px;background:#e9e7eb;color:#444}
#timeline{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 72px);bottom:220px;overflow:auto;padding:18px 14px 25px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;scrollbar-width:none;z-index:4}
.line{display:flex;gap:8px;align-items:flex-end;max-width:90%}.line.me{align-self:flex-end}
.face{width:32px;height:32px;border-radius:50%;background-color:#b9829f;background-image:url("./assets/emotions.webp");background-size:500% 245%;background-position:var(--pose) 20%;background-repeat:no-repeat;border:2px solid #fff;flex-shrink:0}
.bubble{background:#fff;color:#292b2c;padding:11px 13px;border-radius:14px 14px 14px 3px;font-size:16px;line-height:1.5;white-space:pre-wrap;box-shadow:0 2px 4px #0001}
.me .bubble{background:#b4eb91;border-radius:14px 14px 3px 14px}
#options{position:absolute;left:0;right:0;bottom:0;min-height:212px;background:#292333e8;padding:12px 14px calc(15px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:flex-end;gap:9px;z-index:5}
.choice{border:1px solid #bca8c6;border-radius:12px;padding:13px 15px;background:#403449eb;color:#fff;text-align:left;font-size:14px;line-height:1.35;min-height:46px}
.choice:active{background:#794d6a}
#end{position:absolute;inset:0;background:#0b050a;display:none;z-index:7;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;color:#ffc9de}
#end h2{font-size:clamp(35px,10vw,58px);margin:0;letter-spacing:.1em;color:#fff}
#end p{margin:0;line-height:1.7}
#end button{background:#e891af;color:#281323;border:0;border-radius:99px;padding:13px 34px;font-weight:700}
#red{position:absolute;inset:0;background:#b50023;z-index:8;opacity:0;pointer-events:none}
#scare{filter:contrast(1.05)}
@media(max-height:690px){#timeline{bottom:185px}#options{min-height:185px}.choice{padding:8px 13px;min-height:39px}}

/* LINE風モックに寄せた実ゲームUI v2 */
#chat{background:#292733;color:#fff}
#chat .mist{background:radial-gradient(ellipse at 90% 38%,#6a445d 0%,transparent 60%),linear-gradient(120deg,#242538,#323047 55%,#4b344a)}
#chat .mist:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 48%,transparent 16%,rgba(16,15,27,.2) 74%);z-index:1;pointer-events:none}
#chat .portrait{inset:auto;top:-1%;left:18%;width:100%;height:83%;transform:none;background-size:500% 100%;background-position:var(--pose) 50%;opacity:.9;filter:brightness(.66) saturate(.64) contrast(1.08);transition:filter .2s,opacity .2s}
#chat .mist:after{z-index:2;background:linear-gradient(180deg,rgba(20,21,34,.24),rgba(23,23,38,.32) 44%,rgba(26,23,40,.51) 82%,rgba(16,18,30,.75));pointer-events:none}
#chat.danger{background:#25212e}
#chat.danger .portrait{filter:brightness(.74) saturate(.52) contrast(1.15);opacity:.95}
#chat.danger .mist:after{background:linear-gradient(180deg,rgba(14,15,31,.32),rgba(29,21,36,.35) 50%,rgba(55,15,32,.66) 96%)}
#chat.danger::after{box-shadow:inset 0 0 100px #4a071c4a;z-index:3}
#chat .hdr{background:rgba(28,29,43,.96);border-bottom:1px solid #ffffff15;color:#fff;box-shadow:none;gap:13px;padding:calc(env(safe-area-inset-top) + 9px) 17px 12px;min-height:72px}
#chat .hdr .avatar{display:none}
#chat .hdr .nm{font-size:20px;line-height:1.2;font-weight:750;letter-spacing:.01em}
#chat .hdr .online{color:#b9bac8;font-size:12px;margin-top:2px}
#chat .hdr .back{order:-1;margin-left:0;margin-right:1px;background:transparent;border:0;border-radius:8px;width:29px;height:42px;padding:0;font-size:0;flex-shrink:0}
#chat .hdr .back:after{content:"‹";color:#fff;font-size:39px;font-weight:300;line-height:37px}
#chat .hdr:after{content:"⌕  ☎  ☰";margin-left:auto;font-size:21px;white-space:pre;letter-spacing:.04em;color:#f4f0f8}
#chat #timeline{top:calc(env(safe-area-inset-top) + 75px);bottom:calc(284px + env(safe-area-inset-bottom));padding:20px 12px 18px 12px;gap:12px;scrollbar-width:none}
#chat .line{max-width:92%;gap:8px;align-items:flex-end}
#chat .line .face{height:36px;width:36px;min-width:36px;border-color:#bfb4c5;box-shadow:0 0 1px #fff9}
#chat .bubble{background:#faf9fd;color:#22212b;font-size:16px;padding:12px 15px;border-radius:18px 18px 18px 6px;line-height:1.5;box-shadow:0 2px 7px #0002}
#chat .me .bubble{background:#c0eca7;color:#20261f;border-radius:18px 18px 6px 18px}
#chat #options{min-height:0;bottom:calc(76px + env(safe-area-inset-bottom));padding:8px 13px 10px;background:linear-gradient(180deg,transparent,rgba(31,29,43,.18));gap:8px;justify-content:flex-end}
#chat .choice{display:flex;align-items:center;gap:13px;width:100%;min-height:56px;padding:9px 12px;text-align:left;background:rgba(36,35,52,.76);border:1.5px solid rgba(205,195,225,.78);border-radius:15px;color:#fff;font-size:15px;line-height:1.3;box-shadow:inset 0 0 0 1px #ffffff10;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#chat .choice:active{background:rgba(89,62,93,.95);transform:scale(.993)}
#chat .choice .num{height:30px;width:30px;min-width:30px;display:grid;place-items:center;border-radius:50%;background:#ddb7ca;color:#464252;font-size:15px;font-weight:700}
#chat .choice .ctext{flex:1}
#compose{position:absolute;z-index:5;bottom:0;left:0;right:0;min-height:76px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:11px;background:rgba(21,23,36,.88);color:#f4d3e2}
#compose .small{font-size:25px;color:#dbdbe3;line-height:1}
#compose .circle{border:1.5px solid #a6a5b4;height:34px;width:34px;min-width:34px;border-radius:50%;display:grid;place-items:center}
#compose .fakeinput{flex:1;min-width:0;background:#3a3b50;color:#9e9bad;font-size:13px;border-radius:99px;height:37px;display:flex;align-items:center;padding:0 14px;white-space:nowrap}
#compose .send{font-size:26px;color:#e9a2c3}
@media(max-height:700px){#chat #timeline{bottom:calc(258px + env(safe-area-inset-bottom))}#chat .choice{min-height:49px}#chat #options{gap:7px;padding:6px 12px 7px}#compose{min-height:66px}#chat #options{bottom:calc(67px + env(safe-area-inset-bottom))}}

</style></head><body>
<main id="app">
<section id="title" class="screen active"><div class="poster"><img class="art" alt="" src="./assets/sprite.webp"></div><div class="fallback"><div class="icon">🌸</div><b>ドキドキ彼女！</b><p>大好きな彼女とのLINE</p></div><button id="start" aria-label="はじめる"><span class="vis-label">はじめる ♡</span></button></section>
<section id="scare" class="screen"><div class="poster"><img class="art" alt="" src="./assets/sprite.webp"></div><div class="fallback"><div class="icon">🔪</div><b>ずっと一緒だよ？</b></div></section>
<section id="chat" class="screen"><div class="mist"><div class="portrait" id="portrait" role="img" aria-label="美咲の表情：通常"></div></div>
<div class="hdr"><div class="avatar" aria-hidden="true"></div><div><div class="nm">美咲 ♡</div><div class="online">オンライン</div></div><button class="back" id="home">戻る</button></div>
<div id="timeline" aria-live="polite"></div><div id="options"></div>
<div id="compose" aria-hidden="true"><span class="small circle">＋</span><span class="small">▧</span><div class="fakeinput">メッセージを入力…</div><span class="small">☺</span><span class="send">➤</span></div>
<div id="end"><h2>GAME OVER</h2><p>ねぇ、約束したよね？<br>ずっと一緒だって♡</p><button id="restart">もう一度</button></div><div id="red"></div>
</section>
<div id="dark"></div><div id="flash"></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const pages=[$('title'),$('scare'),$('chat')],flash=$('flash'),dark=$('dark'),timeline=$('timeline'),opts=$('options'),chat=$('chat'),red=$('red');
let busy=false,epoch=0,miss=0,mood=0,step=0,dead=false;
const story=[
 {m:['ねぇ♡','今なにしてるの？','私のこと、ちゃんと考えてる？💕'],o:['家でゲームしてるよ！','美咲のこと考えてたよ♡','なんで？ 急にどうしたの？'],c:1,yes:'えへへ♡ うれしい。',no:'……私より大事なこと、あるんだ？'},
 {m:['今日は誰といたの？'],o:['美咲が一番だよ','高校の友達とご飯！','秘密♡'],c:1,yes:'そっか。楽しかった？',no:'……隠し事、してる？'},
 {m:['今から会いに行ってもいい？'],o:['うん、来てほしい！','今日は疲れたからまたね','何時に来るの？'],c:0,yes:'やったぁ♡ すぐ行くね。',no:'……私のこと嫌いなの？'},
 {m:['ねぇ、私のことどれくらい好き？'],o:['世界で一番だよ','好きだよ','それ聞くの何回目？笑'],c:0,yes:'ふふっ。忘れないからね♡',no:'……ちゃんと答えて？'},
 {m:['最後にひとつだけ。','これからも、ずっと一緒だよね？'],o:['もちろん！','できるだけね','重いって笑'],c:0,yes:'……うん。約束だよ♡',no:'……約束してくれないの？'}
];
function sleep(n,t){return new Promise(resolve=>{setTimeout(()=>resolve(n===epoch),t)})}
function page(el){for(const p of pages)p.classList.remove('active');el.classList.add('active')}
function reset(){epoch++;busy=false;miss=0;mood=0;step=0;dead=false;timeline.innerHTML='';opts.innerHTML='';chat.classList.remove('danger');setMood();$('end').style.display='none';flash.style.opacity='0';dark.style.opacity='0';red.style.opacity='0';page($('title'))}
function line(text,mine=false){const wrap=document.createElement('div');wrap.className='line'+(mine?' me':'');if(!mine){const av=document.createElement('span');av.className='face';av.setAttribute('aria-hidden','true');wrap.appendChild(av)}const b=document.createElement('div');b.className='bubble';b.textContent=text;wrap.appendChild(b);timeline.appendChild(wrap);timeline.scrollTop=timeline.scrollHeight}
async function intro(){if(busy)return;busy=true;let n=++epoch;
 flash.style.opacity='1';
 if(!await sleep(n,85))return;page($('scare'));flash.style.opacity='0';
 if(!await sleep(n,145))return;dark.style.opacity='1';
 if(!await sleep(n,1050))return;page(chat);setMood();drawScene(n);
 if(!await sleep(n,130))return;dark.style.opacity='0';busy=false}
function setMood(){
 const positions={'0':'0%','1':'25%','2':'50%','-1':'75%','-2':'100%'};
 const labels={'0':'通常','1':'＋1','2':'＋2','-1':'－1','-2':'－2'};
 chat.style.setProperty('--pose',positions[String(mood)]??'0%');
 chat.dataset.mood=String(mood);
 $('portrait').setAttribute('aria-label','美咲の表情：'+labels[String(mood)]);
 chat.classList.toggle('danger',mood<0);
}
async function drawScene(n){if(step>=story.length){opts.innerHTML='';line('大好き。これからも、ずっと。♡');return}
 const s=story[step];opts.innerHTML='';
 for(const m of s.m){if(!await sleep(n,430))return;line(m)}
 if(n!==epoch||dead)return;
 s.o.forEach((txt,i)=>{const b=document.createElement('button');b.className='choice';const num=document.createElement('span');num.className='num';num.textContent=String(i+1);const caption=document.createElement('span');caption.className='ctext';caption.textContent=txt;b.append(num,caption);b.onclick=()=>answer(i);opts.appendChild(b)})}
async function answer(i){if(busy||dead||step>=story.length)return;busy=true;const n=epoch;const s=story[step];opts.innerHTML='';line(s.o[i],true);
 const correct=i===s.c;
 if(!correct){miss++;mood=miss>=2?-2:-1;}else{mood=Math.min(2,mood+1)}
 setMood();if(!await sleep(n,500))return;
 if(miss>=2){await lose(n);return}
 line(correct?s.yes:s.no);step++;if(!await sleep(n,500))return;busy=false;drawScene(n)}
async function lose(n){dead=true;chat.classList.add('danger');line('……');if(!await sleep(n,700))return;
 for(let i=0;i<16;i++){line('、');if(!await sleep(n,140))return}
 if(!await sleep(n,500))return;line('さよなら。');
 if(!await sleep(n,900))return;flash.style.opacity='1';page($('scare'));
 if(!await sleep(n,90))return;flash.style.opacity='0';red.style.opacity='.65';
 if(!await sleep(n,180))return;red.style.opacity='0';dark.style.opacity='1';
 if(!await sleep(n,1050))return;page(chat);$('end').style.display='flex';dark.style.opacity='0'}
document.querySelectorAll('img.art').forEach(im=>{im.onerror=()=>{im.closest('.screen').classList.add('noart')}})
$('start').addEventListener('click',intro);$('home').addEventListener('click',reset);$('restart').addEventListener('click',reset);
</script></body></html>
